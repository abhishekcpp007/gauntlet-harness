[project]
name = "gauntlet-harness"
version = "0.1.0"
description = "Turn freshly merged GitHub PRs into leak-free RL environments for coding agents, and judge models on F2P / N2P / S2P / P2P tests plus rubrics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abhishek", email = "akvikramaditya007cppcoder@gmail.com" }]
keywords = ["reinforcement-learning", "swe-bench", "agents", "evaluation", "rubrics", "llm", "github"]
dependencies = [
    "gauntlet-sandbox @ git+https://github.com/abhishekcpp007/gauntlet-sandbox",
    "gauntlet-repo2env @ git+https://github.com/abhishekcpp007/gauntlet-repo2env",
    "gauntlet-cheatcatcher @ git+https://github.com/abhishekcpp007/gauntlet-cheatcatcher",
    "gauntlet-timemachine @ git+https://github.com/abhishekcpp007/gauntlet-timemachine",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
# also covers vLLM, Ollama, Together, OpenRouter and anything else that speaks
# the OpenAI chat completions API, through OPENAI_BASE_URL
openai = ["openai>=2.0"]
gym = ["gymnasium>=1.0"]

[project.scripts]
gauntlet = "gauntlet_harness.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekcpp007/gauntlet-harness"

[dependency-groups]
dev = ["openai>=2.0", "pytest>=8", "ruff>=0.6", "anthropic>=2.3", "gymnasium>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon and network access",
    "live: hits the real GitHub API (opt in with GAUNTLET_LIVE=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/gauntlet_harness/report.py" = ["E501"]  # the inline HTML template
